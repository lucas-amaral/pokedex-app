spring:
  application:
    name: pokedex-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pokedex
    username: pokedex
    password: pokedex
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cache:
    cache-names: pokeapi-pokemon-list,pokeapi-pokemon,pokeapi-species,pokeapi-evolution-chain
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=24h,recordStats
  threads:
    virtual:
      enabled: true
  web:
    locale: en
    locale-resolver: fixed

pokedex:
  api:
    version: 0.0.1
  security:
    jwt:
      # Development default only: set POKEDEX_SECURITY_JWT_SECRET (32+ bytes) everywhere else.
      secret: dev-only-secret-change-me-before-any-deployment-0123456789
      token-ttl: 2h
      issuer: pokedex-service
  pokeapi:
    base-url: https://pokeapi.co/api/v2
    connect-timeout: 2s
    read-timeout: 5s
  seed:
    # Demo data for local runs and reviews: Generations 1 and 2 from a bundled PokeAPI snapshot, plus two accounts.
    # Seeding only fills an empty collection and creates missing accounts. Turn off with POKEDEX_SEED_ENABLED=false.
    enabled: true
    accounts:
      - username: oak
        email: oak@pallet.town
        password: professor123
        role: ADMIN
      - username: ash
        email: ash@pallet.town
        password: pikachu123
        role: USER

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
