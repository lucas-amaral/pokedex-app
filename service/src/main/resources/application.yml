spring:
  application:
    name: pokedex-service

pokedex:
  api:
    version: 0.0.1
  pokeapi:
    base-url: https://pokeapi.co/api/v2
    connect-timeout: 2s
    read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
