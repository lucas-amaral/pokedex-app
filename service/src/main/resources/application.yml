spring:
  application:
    name: pokedex-service
  cache:
    cache-names: pokeapi-pokemon-list,pokeapi-pokemon,pokeapi-species
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=24h,recordStats
  web:
    locale: en
    locale-resolver: fixed

pokedex:
  api:
    version: 0.0.1
  pokeapi:
    base-url: https://pokeapi.co/api/v2
    connect-timeout: 2s
    read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
