# Whole stack: `docker compose up --build`, API on http://localhost:8090.
# Development: `docker compose up -d db`, then ./gradlew bootRun.
# Ports are off the defaults (8090, 5433) so the stack does not collide with other local services.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - tasks-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tasks
      # Demo value; set TASKS_SECURITY_JWT_SECRET (32+ bytes) in the shell or a .env file for anything shared.
      TASKS_SECURITY_JWT_SECRET: ${TASKS_SECURITY_JWT_SECRET:-compose-demo-secret-change-me-0123456789abcdef}
    ports:
      - "${API_PORT:-8090}:8090"

volumes:
  tasks-db:
