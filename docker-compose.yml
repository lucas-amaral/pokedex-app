services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pokedex
      POSTGRES_USER: pokedex
      POSTGRES_PASSWORD: pokedex
    ports:
      - "5432:5432"
    volumes:
      - pokedex-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokedex -d pokedex"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pokedex-db:
